short_bio: |
  <p>I am a master's student in psychology, currently focusing my thesis on the regulatory effects of alpha entrainment neural oscillations on executive control. My thesis project comprises two main studies across three experiments, and I am currently in the data collection phase for Experiment 3.</p>
  <p><img src="assets/images/photos/thesis_framework.png" alt="Research Interests" style="float: left; width: 350px; margin-right: 15px; border-radius: 8px;"></p>
  <p>I am currently a <strong>M.S. student</strong> in Institute of Brain and psychological Sciences, <a href="https://ibps.sicnu.edu.cn/" target="_blank">Sichuan Normal University</a>, advised by Prof. <a href="https://ibps.sicnu.edu.cn/p/16/?StId=st_app_news_i_x638514610151893184" target="_blank">Yifeng Wang</a>, with an expected graduation date of 2027. I previously earned my Bachelor of Science degree in psychology from the School of Education at <a href="https://jyxy.hnfnu.edu.cn/" target="_blank">Hunan First Normal University</a>, advised by Prof. <a href="https://jyxy.hnfnu.edu.cn/info/1184/10934.htm" target="_blank">Yuesheng Huang</a>.</p>
  <p>Throughout my journey in psychology, I have grown both professionally and personally. On the technical side, I am capable of independently conducting and analyzing behavioral and EEG experiments. My primary programming language is MATLAB, which I utilize alongside EEGLAB and ERPLAB for EEG preprocessing and frequency-domain analysis. I also integrate MATLAB with Cartool to extract EEG microstates. Furthermore, I am proficient in operating transcranial electrical stimulation (tES) devices, such as tACS, and performing electric field modeling using SimNIBS prior to stimulation. My software toolkit also includes E-Prime for experimental design, SPSS for statistical analysis, and R for data visualization.</p>
  <p>On a personal level, my passion for psychology continues to grow—I view it as a discipline that fosters lifelong curiosity and provides deep mental healing. Learning psychology has equipped me with valuable emotional regulation strategies, empowering me to navigate challenges in both my academic work and daily life with resilience.</p>
  <p><i class="fa-solid fa-graduation-cap" style="color: #d60000;"></i> <span style="color: #d60000;">I am actively seeking Ph.D. opportunities.</span> Driven by my passion for psychology, I hope to continue advancing my academic journey and am currently planning to pursue a doctoral degree in the field.</p>

